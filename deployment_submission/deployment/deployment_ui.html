<!doctype html><html lang="tr"><meta charset="utf-8"><title>ChargeShield Risk Denemesi</title>
<style>body{font-family:Arial;max-width:720px;margin:40px auto;color:#182433}h1{color:#167c80}label{display:block;margin:10px 0}input{width:180px;padding:7px}button{padding:10px 18px;background:#167c80;color:white;border:0;border-radius:5px}pre{background:#f2f5f6;padding:16px;border-radius:6px}</style>
<h1>ChargeShield</h1><p>Merchant şikâyet sinyali ve hakediş aciliyeti ile lokal risk tahmini</p>
<form id="f"><label>Paranın aktarılmasına kalan gün <input name="days_to_release" value="7" type="number" min="0"></label><label>7 günlük şikâyet <input name="complaint_count_7d" value="8" type="number"></label><label>30 günlük şikâyet <input name="complaint_count_30d" value="15" type="number"></label><label>14 günlük negatif yorum oranı <input name="negative_review_ratio_14d" value="0.72" type="number" step="0.01"></label><label>30 günlük negatif yorum oranı <input name="negative_review_ratio_30d" value="0.68" type="number" step="0.01"></label><label>7 günlük metin oranı <input name="text_available_ratio_7d" value="0.90" type="number" step="0.01"></label><label>14 günlük metin oranı <input name="text_available_ratio_14d" value="0.88" type="number" step="0.01"></label><label>Şikâyet hızlanması <input name="complaint_acceleration_7_vs_30" value="2.4" type="number" step="0.01"></label><button>Tahmin Et</button></form><pre id="out">Sonuç burada görünecek.</pre>
<script>f.onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(f));for(let k in o)o[k]=Number(o[k]);let r=await fetch('http://127.0.0.1:8000/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});out.textContent=JSON.stringify(await r.json(),null,2)}</script></html>
